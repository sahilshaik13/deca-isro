# Brain-side Telegraf: consume Kafka sdwan_telemetry_gns3 → Prometheus :9276
# GNS3 fabric only. Pi uses telegraf.bridge.conf (:9274).

[global_tags]
  fabric = "gns3"
  pipeline = "kafka_bridge"

[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 5000
  metric_buffer_limit = 50000
  flush_interval = "1s"
  flush_jitter = "0s"
  hostname = "telemetry-bridge-gns3"
  omit_hostname = false

[[inputs.kafka_consumer]]
  brokers = ["kafka:29092"]
  topics = ["sdwan_telemetry_gns3"]
  consumer_group = "deca-prom-bridge-gns3"
  offset = "newest"
  data_format = "influx"
  max_message_len = 1048576
  max_undelivered_messages = 10000

[[outputs.prometheus_client]]
  listen = "0.0.0.0:9276"
  path = "/metrics"
  expiration_interval = "60s"
  export_timestamp = true
  collectors_exclude = ["gocollector", "process"]
