# DECA SD-WAN air-gapped telemetry stack (brain / management node)
#
# Dual Flow 2:
#   Pi:    edge Telegraf → Kafka sdwan_telemetry_pi    → bridge :9274 → host Prom :9090
#   GNS3:  telegraf-gns3 → Kafka sdwan_telemetry_gns3 → bridge :9276 → compose Prom :9091
#
# Kafka: official apache/kafka (Bitnami free tags removed from Docker Hub).
#
# Host ports:
#   9091  GNS3 Prometheus (host Pi Prom stays on :9090)
#   9092  Kafka EXTERNAL (edge Telegraf on Pis)
#   9274  Pi telemetry-bridge
#   9275  gns3-exporter (1Hz PROBE scrape on :9091)
#   9276  GNS3 telemetry-bridge
#   9308  kafka-exporter

name: deca-telemetry

services:
  kafka:
    image: apache/kafka:3.7.1
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-192.168.50.1}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 6
      # Fixed cluster id for reproducible local KRaft (not a secret)
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - deca_telemetry
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:29092 --list >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  kafka-init-topics:
    image: apache/kafka:3.7.1
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts/kafka_init_topics.sh:/kafka_init_topics.sh:ro
    entrypoint: ["/bin/sh", "/kafka_init_topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    networks:
      - deca_telemetry
    restart: "no"

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9308:9308"
    command:
      - --kafka.server=kafka:29092
    networks:
      - deca_telemetry

  telemetry-bridge:
    image: telegraf:1.30.2
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
    ports:
      - "9274:9274"
    volumes:
      - ./telegraf.bridge.conf:/etc/telegraf/telegraf.conf:ro
    networks:
      - deca_telemetry

  telemetry-bridge-gns3:
    image: telegraf:1.30.2
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
    ports:
      - "9276:9276"
    volumes:
      - ./telegraf.bridge.gns3.conf:/etc/telegraf/telegraf.conf:ro
    networks:
      - deca_telemetry

  telegraf-gns3:
    image: telegraf:1.30.2
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
    environment:
      DECA_GNS3_CHAOS_STATE: /state/chaos_state.json
      DECA_GNS3_HOST_TAG: gns3-pe1
    volumes:
      - ./telegraf.gns3.conf:/etc/telegraf/telegraf.conf:ro
      - ./scripts/gns3_chaos_to_influx.sh:/scripts/gns3_chaos_to_influx.sh:ro
      - ../gns3/state:/state
    networks:
      - deca_telemetry

  # GNS3 fabric gauges (chaos state → Prom fabric=gns3); scraped only by :9091
  gns3-exporter:
    image: python:3.10-slim
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    working_dir: /app
    command: ["python3", "/app/exporters/gns3_path_exporter.py"]
    environment:
      DECA_GNS3_CHAOS_STATE: /app/state/chaos_state.json
      DECA_GNS3_EXPORTER_PORT: "9275"
    volumes:
      - ../gns3/exporters:/app/exporters:ro
      - ../gns3/state:/app/state
    ports:
      - "9275:9275"
    networks:
      - deca_telemetry

  prometheus:
    image: prom/prometheus:v2.45.6
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    depends_on:
      - telemetry-bridge-gns3
      - gns3-exporter
      - kafka-exporter
    ports:
      - "9091:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - deca_telemetry

volumes:
  kafka_data:
  prometheus_data:

networks:
  deca_telemetry:
    driver: bridge
    internal: false
