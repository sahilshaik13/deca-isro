# Minimal snmpd for Telegraf inputs.snmp on the Pi (localhost only).
#   sudo cp lab/telemetry-pipeline/snmpd.deca.conf /etc/snmp/snmpd.conf
#   sudo systemctl enable --now snmpd
#
# Community is lab-local (not Internet-facing). agentAddress loopback only.

agentAddress  udp:127.0.0.1:161
rocommunity   deca-lab  127.0.0.1
view   systemonly  included   .1.3.6.1.2.1.1
view   systemonly  included   .1.3.6.1.2.1.2
view   systemonly  included   .1.3.6.1.2.1.31
rocommunity  deca-lab  default  -V systemonly
sysLocation    DECA Lab
sysContact     deca-lab@local
sysServices    72
