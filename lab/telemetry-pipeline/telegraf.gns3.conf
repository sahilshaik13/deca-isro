# GNS3 edge Telegraf (compose) — fabric=gns3 → Kafka sdwan_telemetry_gns3
# Probe stand-in: exec reads chaos_state.json as Influx lines until FRR L3 agents live.
# SNMP/syslog/IPFIX stubs stay commented; enable after install_gns3_edge.sh.

[global_tags]
  fabric = "gns3"
  pipeline = "edge_gns3"

[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 2000
  metric_buffer_limit = 20000
  collection_jitter = "0s"
  flush_interval = "1s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "gns3-telegraf"
  omit_hostname = false

###############################################################################
# INPUTS — 1Hz PROBE stand-in (same schema as Pi sdwan_path_*)
###############################################################################

[[inputs.exec]]
  interval = "1s"
  commands = ["/scripts/gns3_chaos_to_influx.sh"]
  timeout = "4s"
  data_format = "influx"
  [inputs.exec.tags]
    source = "gns3_probe"
    host = "gns3-pe1"

# Future (after install_gns3_edge.sh + node IPs):
# [[inputs.snmp]] … agents = ["udp://<PE1>:161"]
# [[inputs.syslog]] … server = "udp://:5515"
# [[inputs.exec]] … softflowd / tunnel stats via docker exec

###############################################################################
# OUTPUT — Kafka GNS3 topic
###############################################################################

[[outputs.kafka]]
  brokers = ["kafka:29092"]
  topic = "sdwan_telemetry_gns3"
  routing_tag = "host"
  data_format = "influx"
  max_retry = 3
  compression_codec = 0
