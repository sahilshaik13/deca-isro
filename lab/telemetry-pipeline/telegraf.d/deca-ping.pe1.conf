# PE1 management LAN pings (default table) via exec — no inputs.ping stderr noise.

[[inputs.exec]]
  interval = "5s"
  timeout = "6s"
  commands = ["/usr/local/bin/deca-lan-ping.sh 192.168.50.20"]
  data_format = "influx"

[[inputs.exec]]
  interval = "5s"
  timeout = "6s"
  commands = ["/usr/local/bin/deca-lan-ping.sh 192.168.50.10"]
  data_format = "influx"
