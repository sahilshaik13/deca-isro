# Mission VRF pings (SAC / Mauritius CEs). Requires cap_net_raw on ping +
# /usr/local/bin/deca-vrf-ping.sh. Station1 (PE1) only.

[[inputs.exec]]
  interval = "5s"
  timeout = "8s"
  commands = ["/usr/local/bin/deca-vrf-ping.sh 10.100.2.1 vrf-mission"]
  data_format = "influx"

[[inputs.exec]]
  interval = "5s"
  timeout = "10s"
  commands = ["/usr/local/bin/deca-vrf-ping.sh 10.100.3.1 vrf-mission"]
  data_format = "influx"
