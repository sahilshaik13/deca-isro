# Telegraf drop-in — live HTB payload (1:15) ceil for Q2 util features.
# Install:
#   sudo install -m 0755 lab/exporters/deca-htb-payload-ceil.sh /usr/local/bin/deca-htb-payload-ceil.sh
#   sudo cp lab/telemetry-pipeline/telegraf.d/deca-htb-payload-ceil.conf /etc/telegraf/telegraf.d/
#   sudo systemctl restart telegraf
[[inputs.exec]]
  commands = ["/usr/local/bin/deca-htb-payload-ceil.sh"]
  timeout = "3s"
  interval = "1s"
  data_format = "influx"
  name_override = "htb_payload_ceil_mbps"
