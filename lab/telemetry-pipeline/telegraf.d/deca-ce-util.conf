# Telegraf drop-in — per-CE util (deploy to PE: /etc/telegraf/telegraf.d/deca-ce-util.conf)
# Install exporter: sudo install -m 0755 lab/exporters/deca-ce-util.sh /usr/local/bin/deca-ce-util.sh
[[inputs.exec]]
  commands = ["/usr/local/bin/deca-ce-util.sh"]
  timeout = "3s"
  interval = "1s"
  data_format = "influx"
