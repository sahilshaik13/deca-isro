# Forward FRR / routing daemon logs to local Telegraf syslog input.
# Telegraf listens on UDP :5514 (unprivileged); install_edge.sh rewrites port.
# Use Traditional (BSD/RFC3164) forward format — NOT Protocol23/RFC5424 —
# so inputs.syslog with syslog_standard = "RFC3164" can parse timestamps.
#
# Install on PE:
#   sudo cp lab/telemetry-pipeline/rsyslog-deca-frr.conf /etc/rsyslog.d/30-deca-frr.conf
#   sudo systemctl restart rsyslog
#
# Air-gapped: localhost only.

if $programname contains "bgpd" or $programname contains "ospfd" or $programname contains "zebra" or $programname contains "frr" then {
  action(type="omfwd" target="127.0.0.1" port="514" protocol="udp"
         template="RSYSLOG_TraditionalForwardFormat"
         action.resumeRetryCount="1"
         queue.type="linkedList" queue.size="1000")
  stop
}
