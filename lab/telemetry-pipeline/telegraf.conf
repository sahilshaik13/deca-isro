# DECA edge Telegraf — PE nodes (station1 / station2) — Pi fabric
# Syslog + softflowd IPFIX summary + tunnel stats + net → Kafka topic sdwan_telemetry_pi
# (legacy topic name sdwan_telemetry is retired; dual-fabric split)
#
# Ubuntu jammy telegraf 1.21 notes:
#   - no inputs.netflow plugin → use exec + softflowctl exporter
#   - telegraf user cannot bind :514 → use :5514 (rsyslog forwards here)
#
# Air-gap: no cloud plugins. flush_interval = 1s.

[global_tags]
  fabric = "pi"
  pipeline = "edge"

[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 2000
  metric_buffer_limit = 20000
  collection_jitter = "0s"
  flush_interval = "1s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = ""
  omit_hostname = false

###############################################################################
# INPUTS
###############################################################################

# Native Linux interface counters
[[inputs.net]]
  interval = "1s"
  interfaces = ["eth0", "gre-te-core", "veth-pe-*"]
  ignore_protocol_stats = true

# Local snmpd (127.0.0.1:161). Numeric OIDs — no MIB download required.
[[inputs.snmp]]
  agents = ["udp://127.0.0.1:161"]
  version = 2
  community = "deca-lab"
  interval = "1s"
  timeout = "2s"
  retries = 1
  [[inputs.snmp.table]]
    name = "interface"
    oid = "1.3.6.1.2.1.2.2"
    [[inputs.snmp.table.field]]
      name = "ifName"
      oid = "1.3.6.1.2.1.31.1.1.1.1"
      is_tag = true
    [[inputs.snmp.table.field]]
      name = "net_bytes_recv"
      oid = "1.3.6.1.2.1.2.2.1.10"
    [[inputs.snmp.table.field]]
      name = "net_bytes_sent"
      oid = "1.3.6.1.2.1.2.2.1.16"
    [[inputs.snmp.table.field]]
      name = "net_err"
      oid = "1.3.6.1.2.1.2.2.1.14"
    [[inputs.snmp.table.field]]
      name = "net_drop"
      oid = "1.3.6.1.2.1.2.2.1.13"

# FRR BGP/OSPF events via rsyslog → UDP :5514
# rsyslog MUST use RSYSLOG_TraditionalForwardFormat (RFC3164), not Protocol23/RFC5424.
[[inputs.syslog]]
  server = "udp://:5514"
  syslog_standard = "RFC3164"
  best_effort = true

# softflowd IPFIX summary (softflowd still exports to 127.0.0.1:2055)
# NOTE: script is heavy (~3–7s). Do NOT schedule at 1s — overlaps melt Pi CPU.
[[inputs.exec]]
  interval = "30s"
  commands = ["/usr/local/bin/deca-netflow-flow-count.sh"]
  timeout = "8s"
  data_format = "influx"
  [inputs.exec.tags]
    source = "softflowd_ipfix"

[[inputs.exec]]
  interval = "1s"
  commands = ["/usr/local/bin/sdwan_tunnel_stats.sh"]
  timeout = "4s"
  data_format = "influx"

###############################################################################
# OUTPUT — Kafka (pipeline path). Existing prometheus_client :9273 may coexist
# in other telegraf.d drop-ins for legacy direct scrape.
###############################################################################

[[outputs.kafka]]
  brokers = ["192.168.50.1:9092"]
  topic = "sdwan_telemetry_pi"
  routing_tag = "host"
  data_format = "influx"
  max_retry = 3
  compression_codec = 0
