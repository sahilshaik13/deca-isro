# Brain-side Telegraf: consume Kafka sdwan_telemetry_pi → Prometheus :9274
# Pi fabric only. GNS3 uses telegraf.bridge.gns3.conf (:9276).

[global_tags]
  fabric = "pi"
  pipeline = "kafka_bridge"

[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 5000
  metric_buffer_limit = 50000
  flush_interval = "1s"
  flush_jitter = "0s"
  hostname = "telemetry-bridge"
  omit_hostname = false

[[inputs.kafka_consumer]]
  brokers = ["kafka:29092"]
  topics = ["sdwan_telemetry_pi"]
  consumer_group = "deca-prom-bridge-pi"
  offset = "newest"
  data_format = "influx"
  max_message_len = 1048576
  max_undelivered_messages = 10000

[[outputs.prometheus_client]]
  listen = "0.0.0.0:9274"
  path = "/metrics"
  expiration_interval = "60s"
  export_timestamp = true
  collectors_exclude = ["gocollector", "process"]
