# DECA swanctl IPsec — PE1 template (station1).
# Peer PE2 mirrors with swapped local/remote addrs, certs, and traffic selectors.
#
# CRITICAL: copy_dscp = out — copies inner DSCP onto outer ESP so PE HTB can
# prioritize TT&C (0x88) / Payload (0x80) without decrypting.
#
# Install:
#   sudo cp lab/swanctl/deca-sdwan.pe1.conf /etc/swanctl/conf.d/deca-sdwan.conf
#   sudo swanctl --load-all && sudo swanctl --initiate --child net
# Boot: lab/deca-swanctl-up.sh via deca-swanctl-up.service

connections {
    deca-sdwan {
        version = 2
        local_addrs = 192.168.50.10
        remote_addrs = 192.168.50.20
        proposals = aes128-sha256-x25519
        local {
            auth = pubkey
            certs = station1-cert.pem
            id = "CN=station1"
        }
        remote {
            auth = pubkey
            id = "CN=station2"
        }
        children {
            net {
                local_ts = 10.100.1.1/32,10.10.1.0/30,10.100.3.1/32,10.10.3.0/30,10.101.1.0/29,10.101.3.0/29
                remote_ts = 10.100.2.1/32,10.10.2.0/30,10.100.4.1/32,10.10.4.0/30,10.101.2.0/29,10.101.4.0/29
                esp_proposals = aes128-sha256
                copy_dscp = out
                start_action = start
                dpd_action = restart
            }
        }
        dpd_delay = 30s
    }
}
